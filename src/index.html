<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticky Tasks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="yellow">
  <main class="note" id="note">
    <header class="titlebar" data-tauri-drag-region>
      <div class="title" data-tauri-drag-region>
        <span class="logo" data-tauri-drag-region>✦</span>
        <span data-tauri-drag-region>Tarefas</span>
      </div>
      <div class="actions">
        <button id="btn-select" class="icon-btn" title="Selecionar várias" aria-label="Selecionar várias">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5l1.8 1.8L8.5 5"/><path d="M3.5 12.5l1.8 1.8 3.2-3.3"/><path d="M3.5 18.5l1.8 1.8 3.2-3.3"/><path d="M12 7h9M12 13h9M12 19h9"/></svg>
        </button>
        <button id="btn-pin" class="icon-btn active" title="Fixar sobre as outras janelas" aria-label="Fixar">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 7 3 3v2H7v-2l3-3z"/></svg>
        </button>
        <button id="btn-theme" class="icon-btn" title="Trocar cor" aria-label="Trocar cor">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="15.5" cy="10" r="1"/></svg>
        </button>
        <button id="btn-min" class="icon-btn" title="Minimizar" aria-label="Minimizar">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></svg>
        </button>
        <button id="btn-close" class="icon-btn danger" title="Fechar" aria-label="Fechar">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>

    <section class="summary">
      <div class="summary-row">
        <div class="summary-text">
          <strong id="count-done">0</strong><span> de </span><strong id="count-total">0</strong><span> concluídas</span>
        </div>
        <button id="btn-sort" class="sort-btn" title="Ordenar por data de criação">
          <svg id="sort-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
          <span id="sort-label">Mais recentes</span>
        </button>
      </div>
      <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
    </section>

    <form class="add" id="add-form" autocomplete="off">
      <input id="add-input" type="text" placeholder="Nova tarefa…" maxlength="140" />
      <button type="submit" class="add-btn" aria-label="Adicionar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>

    <div class="selbar" id="selbar">
      <button id="sel-all" class="sel-all" aria-label="Selecionar tudo">
        <span class="box" id="sel-all-box"></span>
        <span id="sel-all-label">Selecionar tudo</span>
      </button>
      <div class="sel-actions">
        <button id="sel-delete" class="sel-delete" disabled>Excluir</button>
        <button id="sel-cancel" class="link-btn">Cancelar</button>
      </div>
    </div>

    <ul class="list" id="list"></ul>

    <div class="empty" id="empty">
      <div class="empty-emoji">🌿</div>
      <p>Tudo em dia!<br /><small>Adicione uma anotação rápida acima.</small></p>
    </div>

    <footer class="foot">
      <button id="btn-clear" class="link-btn">Limpar concluídas</button>
    </footer>
  </main>

  <script src="main.js"></script>
</body>
</html>
