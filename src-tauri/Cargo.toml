[package]
name = "sticky-tasks"
version = "0.1.0"
description = "Sticker de tarefas para a área de trabalho"
edition = "2021"

[lib]
name = "sticky_tasks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
